title: Учёный Полиса
access: свободный
icon: resources/roles/polis/ScientistPolis.png
fraction_page: fractions/polis.html
description:
- Учёный Полиса — хранитель знаний метро. Вы работаете в лабораториях и библиотеке,
  изучаете аномалии, мутантов и артефакты, делитесь результатами со станцией.
- 'Важно: исследования важнее перестрелок. На вылазку берите военных, а не геройствуйте
  в одиночку.'
duties:
- Проведение исследований и ведение записей
- Работа с лабораторией, библиотекой и оборудованием Полиса
- Анализ находок, принесённых с поверхности и из тоннелей
- Помощь станции советом и технологиями
- Опрятно выглядеть
rights:
- Доступ к лабораториям и библиотеке Полиса
- Запрос военного сопровождения на вылазки
- Обмен знаниями с другими фракциями при согласии руководства
requirements:
- Интерес к ролевой игре и исследованиям
- Быть адекватным
- Не использовать нецензурную лексику
extra:
- 'Играя на этой должности, помните: Полис держится на знаниях. Не уничтожайте уникальные
  образцы без нужды и не мешайте коллегам ради «эксперимента ради эксперимента».'
