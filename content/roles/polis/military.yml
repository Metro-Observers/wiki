title: Военный Полиса
access: свободный
icon: resources/roles/polis/MilitaryPolis.png
fraction_page: fractions/polis.html
description:
- Военный Полиса — щит станции. Вы охраняете входы, сопровождаете вылазки учёных и
  гасите угрозы, пока остальные работают.
- 'Важно: сила Полиса — в порядке, а не в бессмысленной стрельбе. Сначала предупреждение,
  потом сила.'
duties:
- Охрана территорий и КПП Полиса
- Сопровождение учёных в вылазках
- Урегулирование столкновений на станции
- Подчинение старшим по гарнизону Полиса
- Контроль за теми, кто проходит через Полис
- Опрятно выглядеть
rights:
- Просить посетителей сдать оружие на территории Полиса
- Задержание лиц, объявленных в розыск
- Патрулирование станции и прилегающих тоннелей
- Осмотр посетителей при подозрении на угрозу
requirements:
- Уметь пользоваться оружием
- Иметь способность быстро принимать решения
- Быть адекватным
- Не использовать нецензурную лексику
extra:
- Играя на этой должности, необходимо понимать, что все игроки — люди, которые хотят
  получить удовольствие от раунда. Не убивайте за устный отказ сдать оружие; эскалация
  только при реальной угрозе.
