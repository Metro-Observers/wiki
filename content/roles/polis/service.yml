title: Обслуживающий Полиса
access: свободный
icon: resources/roles/polis/ServicePolis.png
fraction_page: fractions/polis.html
description:
- Обслуживающий Полиса — основа быта станции. Вы готовите еду, таскаете грузы, чините
  мелочь и помогаете учёным и военным, чтобы Полис не остановился.
- 'Важно: без вас лаборатории и казармы быстро встанут. Не геройствуйте в тоннелях
  без нужды — ваша работа внутри станции.'
duties:
- Содержание кухни, складов и общих помещений Полиса
- Помощь учёным с переноской образцов и оборудования
- Снабжение военных едой, медикаментами и расходниками
- Поддержание порядка и чистоты на станции
- Опрятно выглядеть и носить форму Полиса
rights:
- Свободный доступ к бытовым помещениям Полиса
- Запрос помощи у военных при угрозе станции
- Участие в мирной жизни станции и торговле с соседями
requirements:
- Уметь помогать другим игрокам
- Быть адекватным
- Не использовать нецензурную лексику
extra:
- 'Играя на этой должности, помните: Полис — центр знаний метро. Грубость и хаос здесь
  неуместны. Не мешайте учёным и не лезьте в чужие конфликты без причины.'
