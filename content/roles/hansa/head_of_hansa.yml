title: Глава Ганзы
access: свободный
icon: resources/roles/hansa/HeadOfHansa.png
fraction_page: fractions/hansa.html
description:
- "Глава ганзы - высшая руководящая должность на станции \"Ганза\". Ваша задача заключается\
  \ в координации действий на торговой станции \"Ганза\".\n                Составляйте\
  \ список запрещенных предметов, чтобы торговый агент конфисковывал их при обыске...\
  \ Или объявляйте людей в розыск."
- 'Важно: Глава Ганзы и его заместитель имеют право требовать налоговый лист у любого
  посетителя станции. Налог составляет до 30 пуль и подтверждается печатью торгового
  агента или начальника станции.'
duties:
- Управление офицерами, гражданами и торговым агентом Ганзы
- Решение военных конфликтов Ганзы
- Решение медицинских, продовольческих вопросов станции
- Контроль за контрабандой
- Ведение финансовой отчетности
rights:
- Полный доступ ко всем частям станции
- Возможность вносить вещи/ресурсы в список контрабанды
- Возможность объявлять запрет на переход определенных лиц через Ганзу
- Возможность объявлять полный запрет на переход людей через Ганзу при чрезвычайных
  ситуациях
- Право требовать налоговый лист у любого посетителя (до 30 пуль)
- Право запросить помощь ЦК для выпроваживания людей без паспорта Ганзы (не действует
  во время войны и для граждан Ганзы)
requirements:
- Иметь опыт игры на командной должности
- Быть адекватным
- Не использовать нецензурную лексику
extra:
- Играя на этой должности, желательно составлять отчеты для передачи их на командование
  внешнего кольца. В случае возникновения затруднительной ситуации или желания усложнить
  текущий геймплей, Вы имеете право воспользоваться красным телефоном.
