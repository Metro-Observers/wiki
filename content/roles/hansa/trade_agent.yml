title: Торговый агент
access: свободный
icon: resources/roles/hansa/TradeAgentHansa.png
fraction_page: fractions/hansa.html
description:
- "Торговый агент - бюрократическая роль, для любителей ручки и листка бумаги. Следите\
  \ за всем, что проходит через Ганзу.\n                  Вы можете проводить обыски\
  \ посетителей как лично, так и через офицеров Ганзы, для выявления наличия контрабанды.\n\
  \                  В случае наличия таковой у гражданина метрополитена можно выписать\
  \ штраф или отправить его в заключение на соразмерное с уровнем контрабанды время.\n\
  \                  Если задержать посетителя-нарушителя не удалось, то можно объявить\
  \ такового в розыск после согласования с главой Ганзы."
- Помните, что вы - лицо бюрократии! Пишите отчеты при каждом удобном случае.
- 'Важно: Торговый агент имеет право выдавать налоговые листы с печатью после уплаты
  налога (до 30 пуль). Налоговый лист подтверждает легальность посещения станции Ганза.'
duties:
- Участие в решении политических/экономических проблем Ганзы
- Подчинение главе Ганзы
- Контроль за всем, что проходит через Ганзу
- Выдача налоговых листов с печатью после уплаты налога
- Опрятно выглядеть
- Избегать нецензурной лексики
rights:
- Обыскивать посетителей Ганзы
- Проводить обыски граждан Ганзы при подозрении на наличие контрабанды
- С письменного согласия главы Ганзы объявлять людей в розыск
- Просить или приказывать (но уже письменно) офицерам Ганзы помочь с обыском или провести
  его
- Писать отчеты
- Выдавать налоговые листы с официальной печатью (подтверждение уплаты налога до 30
  пуль)
requirements:
- Уметь быстро ориентироваться в бумажной работе
- Иметь способность быстро принимать решения
- Быть адекватным
- Не использовать нецензурную лексику
- Грамотно писать
extra:
- Выбирая эту должность, Вы вступаете на путь бюрократии, так что будьте готовы писать
  много отчетов! В случае чего Вам дана возможность связаться с командованием из внешнего
  кольца, используя красный телефон.
