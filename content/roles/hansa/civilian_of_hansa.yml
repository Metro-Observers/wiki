title: Гражданин Ганзы
access: свободный
icon: resources/roles/hansa/CivilianHansa.png
fraction_page: fractions/hansa.html
description:
- Гражданин ганзы - торговая роль. Если хотите быть как обычный сталкер, но при этом
  иметь преимущество в возможности скупить в самом начале раунда самые выгодные предложения,
  то эта роль для Вас.
duties:
- Участие в решении военных конфликтов Ганзы
- Подчинение главе Ганзы, офицеру Ганзы и частичное подчинение торговому агенту
- Жить
rights:
- Вести торговую дейятельность
requirements:
- Уметь адекватно общаться
extra:
- Играя на этой должности, Вы практически не несете никакой обязанности, но помните,
  что даже при таких условиях происходит влияние на общую атмосферу раунда.
