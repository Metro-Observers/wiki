title: Офицер Ганзы
access: свободный
icon: resources/roles/hansa/OfficerHansa.png
fraction_page: fractions/hansa.html
description:
- Офицер ганзы - важная роль, обеспечивающая порядок и спокойствие на станции. Контроллируйте
  тех, кто проходит через Вашу территорию. А также помогайте торговому агенту.
- 'Важно: Охранники Ганзы получили право самостоятельно требовать налоговый лист у
  любого посетителя без согласования со штабом. Налог составляет до 30 пуль.'
duties:
- Охрана территорий и урегулирование столкновений между гражданами/посетителями Ганзы
- Участие в решении военных конфликтов Ганзы
- Подчинение главе Ганзы и частичное подчинение торговому агенту
- Контроль за всеми, кто проходит через Ганзу
- Проверка наличия налоговых листов у посетителей (до 30 пуль)
- Опрятно выглядеть
rights:
- Просить граждан сдать оружие при посещении территории Ганзы
- Осматривать лица посетителей
- Задержание граждан метро, объявленных в розыск
- Помощь торговому агенту в проведении обысков (обнаружении контрабанды)
- Требовать налоговый лист у любого посетителя станции (до 30 пуль) без согласования
  со штабом
- Патрулирование станции (охранники больше не привязаны к КПП)
requirements:
- Уметь пользоваться оружием
- Иметь способность быстро принимать решения
- Быть адекватным
- Не использовать нецензурную лексику
extra:
- Играя на этой должности, необходимо обязательно понимать, что все игроки - люди,
  которые хотят получить удовольствие от раунда, поэтому убивать кого-то за отказ
  сдать оружие не стоит (речь идет про устный отказ, а не перестрелку)...
